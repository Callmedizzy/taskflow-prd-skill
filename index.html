<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563EB">
  <title>TaskFlow — Kalender Tugas Terintegrasi</title>
  <link rel="stylesheet" href="src/styles/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div class="brand"><div class="brand-mark">TF</div><div><strong>TaskFlow</strong><small>Kalender Tugas</small></div></div>
      <div class="nav-label">WORKSPACE</div>
      <button class="nav-item active" data-view="dashboard"><span>▦</span> Dashboard</button>
      <button class="nav-item" data-view="calendar"><span>▣</span> Kalender</button>
      <button class="nav-item" data-view="tasks"><span>☷</span> Semua Tugas</button>
      <button class="nav-item add" id="addNav"><span>＋</span> Tambah Tugas</button>
      <div class="sidebar-foot">
        <div class="reminder-card"><div class="reminder-icon">♢</div><div><b>Pengingat</b><small>H-3 dan H-1 · 09.00</small></div></div>
        <div class="user"><div class="avatar">BD</div><div class="user-info"><b>Budi</b><small>Mahasiswa</small></div></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Buka navigasi">☰</button>
        <div class="breadcrumb">Workspace <span>/</span> <b id="pageName">Dashboard</b></div>
        <div class="top-actions"><button class="icon-button has-dot" id="reminderButton" aria-label="Lihat jadwal pengingat">♢<span id="reminderDot"></span></button><div class="avatar">BD</div></div>
      </header>
      <div id="content" class="content" aria-live="polite"></div>
      <footer class="footer-note">TaskFlow · Kalender Tugas Terintegrasi <span>Data disimpan pada browser perangkat ini.</span></footer>
    </main>
  </div>
  <div class="overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden aria-hidden="true">
    <section class="modal" id="modalContent"></section>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <script src="src/utils/core.js"></script>
  <script src="src/utils/app-new.js"></script>
</body>
</html>
